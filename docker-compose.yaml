version: "3.8"
services:
  asset_management:
    image: seaotter316/asset_management:test
    container_name: asset_management
    env_file:
      - /home/ubuntu/.env.prod
    networks:
      - my-network
    command: sh -c "uv run alembic upgrade head && uv run uvicorn asset_management.main:app --host 0.0.0.0 --port 8000"
    restart: always
  
  nginx:
    depends_on:
      - asset_management
    container_name: nginx-container
    image: nginx:1.29-alpine-slim
    ports:
      - 80:80
      - 443:443
    volumes:
      - /etc/letsencrypt/live/api.baroborrow.p-e.kr/fullchain.pem:/etc/letsencrypt/live/api.baroborrow.p-e.kr/fullchain.pem:ro
      - /etc/letsencrypt/live/api.baroborrow.p-e.kr/privkey.pem:/etc/letsencrypt/live/api.baroborrow.p-e.kr/privkey.pem:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fastapi.conf:/etc/nginx/conf.d/fastapi.conf:ro
    networks:
      - my-network
    restart: always
networks:
  my-network: